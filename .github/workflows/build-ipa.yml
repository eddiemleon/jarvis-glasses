# Compila la app en una Mac de GitHub (gratis) y la prueba con las gafas simuladas oficiales de Meta.
# Resultado: Jarvis-unsigned.ipa para instalar con Sideloadly (se firma con su Apple ID).
name: Build IPA (sin firmar)
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
concurrency:
  group: build-ipa
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26-intel   # las Mac arm64 de GitHub estaban sin capacidad
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Elegir el Xcode más nuevo
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -5
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Motor de voz local (sherpa-onnx) y modelo de la voz de Jarvis
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V=v1.12.40   # última versión con espeak-ng (pronunciación en español)
          mkdir -p Vendor && cd Vendor
          curl -fsSL -o so.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/$V/sherpa-onnx-$V-ios.tar.bz2"
          tar xjf so.tar.bz2 && rm so.tar.bz2
          # el archivo trae un enlace simbólico a la versión de onnxruntime: se reemplaza por la carpeta real
          ORT=build-ios/ios-onnxruntime
          if [ -L "$ORT/onnxruntime.xcframework" ]; then T=$(cd "$ORT" && readlink onnxruntime.xcframework); rm "$ORT/onnxruntime.xcframework"; cp -R "$ORT/$T" "$ORT/onnxruntime.xcframework"; fi
          ls build-ios "$ORT/onnxruntime.xcframework"
          cd ..
          rm -rf VozJarvis && mkdir -p VozJarvis /tmp/vj
          if git fetch -q --depth 1 origin voz-modelo 2>/dev/null && git show FETCH_HEAD:jarvis-voz.zip > /tmp/vj/jarvis-voz.zip 2>/dev/null && [ -s /tmp/vj/jarvis-voz.zip ]; then
            unzip -q /tmp/vj/jarvis-voz.zip -d VozJarvis
            echo jarvis > VozJarvis/origen.txt
          else
            echo "Aún no hay voz de Jarvis entrenada: se usa un modelo de prueba solo para las pruebas automáticas."
            curl -fsSL -o /tmp/vj/m.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-davefx-medium.tar.bz2
            tar xjf /tmp/vj/m.tar.bz2 -C /tmp/vj
            D=/tmp/vj/vits-piper-es_ES-davefx-medium
            cp "$D"/*.onnx VozJarvis/jarvis.onnx; cp "$D/tokens.txt" VozJarvis/; cp -R "$D/espeak-ng-data" VozJarvis/
            echo prueba > VozJarvis/origen.txt
          fi
          ls -la VozJarvis; du -sh VozJarvis
      - name: Generar proyecto
        working-directory: ios
        run: xcodegen generate
      - name: Resolver paquetes (SDK de Meta)
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project Jarvis.xcodeproj -scheme Jarvis
      - name: Compilar para iPhone
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log
      - name: Empaquetar .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Jarvis.app Payload/
          zip -qry Jarvis-unsigned.ipa Payload
          ls -la Jarvis-unsigned.ipa
          # Verifica que el logo quedó dentro de la app
          if plutil -p Payload/Jarvis.app/Info.plist | grep -q CFBundleIconName && [ -f Payload/Jarvis.app/Assets.car ]; then echo "JARVIS-CHECK logo: OK" | tee -a build.log; else echo "JARVIS-CHECK logo: FALTA" | tee -a build.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-unsigned-ipa
          path: ios/Jarvis-unsigned.ipa
      - name: Probar con gafas simuladas de Meta (simulador de iPhone)
        working-directory: ios
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]|iPhone 2" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulador: $SIM"
          # Reintento: el simulador de Apple a veces se bloquea al arrancar ("RPC timeout"), sin relación con la app.
          for intento in 1 2 3; do
            echo "Intento $intento" | tee -a test.log
            if xcodebuild test -project Jarvis.xcodeproj -scheme Jarvis -destination "id=$SIM" \
                 -derivedDataPath build-test CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO > test-run.log 2>&1; then
              cat test-run.log >> test.log; exit 0
            fi
            cat test-run.log >> test.log
            grep -q "never finished bootstrapping\|deadlocked" test-run.log || exit 1
            xcrun simctl shutdown all || true; xcrun simctl erase "$SIM" || true; sleep 5
          done
          exit 1
      - name: Publicar la app en "Releases" (descarga directa)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag 2>/dev/null || true
          gh release create ultima ios/Jarvis-unsigned.ipa --title "Jarvis - última versión" \
            --notes "Compilada y probada con las gafas simuladas de Meta. Instálela con Sideloadly usando su Apple ID." --latest
      - name: Guardar la app en la rama "app" (para entregarla directo)
        if: success()
        run: |
          cp ios/Jarvis-unsigned.ipa /tmp/Jarvis-unsigned.ipa
          git config user.name "jarvis-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan app
          git rm -rqf --cached . >/dev/null 2>&1 || true
          cp /tmp/Jarvis-unsigned.ipa Jarvis-unsigned.ipa
          git add -f Jarvis-unsigned.ipa && git commit -qm "app ${{ github.run_id }}" && git push -qf origin HEAD:app
          git checkout -q -f ${{ github.sha }}
      - name: Publicar informe de compilación y pruebas
        if: always()
        working-directory: ios
        run: |
          {
            echo "run=${{ github.run_id }} commit=${{ github.sha }} fecha=$(date -u +%FT%TZ)"
            echo "== compilación =="; grep -E "error:|BUILD SUCCEEDED|BUILD FAILED|JARVIS-CHECK" build.log 2>/dev/null | sort -u | head -60
            echo "== pruebas =="
            grep -E "error:|Test Case|Executed|TEST SUCCEEDED|TEST FAILED|Testing failed|XCTAssert|Simulador|JARVIS-CHECK" test.log 2>/dev/null | head -150
            echo "== final de pruebas =="; grep -v "^objc\\[" test.log 2>/dev/null | tail -40
          } > report.txt || true
          cp report.txt /tmp/report.txt
          cd "$GITHUB_WORKSPACE"
          git config user.name "jarvis-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan ci-report
          git rm -rqf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/report.txt report.txt
          git add report.txt && git commit -qm "informe ${{ github.run_id }}" && git push -qf origin HEAD:ci-report || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            ios/build.log
            ios/test.log
