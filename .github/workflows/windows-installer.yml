# Prueba real del instalador de Windows en una PC Windows de GitHub (sin iPhone).
name: Probar instalador de Windows
on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Instalar todo con instalar.ps1
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes("$PWD\windows\Jarvis.ipa", (New-Object byte[] 2048))
          winget --version
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\instalar.ps1 -CI *>&1 | Tee-Object -FilePath win.log
          $code = $LASTEXITCODE
          "--- condiciones de iCloud64.msi ---" | Tee-Object -FilePath win.log -Append
          $msi = Get-ChildItem "$env:TEMP\JarvisInstalador" -Filter iCloud64.msi -Recurse | Select-Object -First 1
          if ($msi) {
            $inst = New-Object -ComObject WindowsInstaller.Installer
            $db = $inst.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$inst,@($msi.FullName,0))
            $v = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@('SELECT `Condition`,`Description` FROM `LaunchCondition`'))
            $v.GetType().InvokeMember('Execute','InvokeMethod',$null,$v,$null)
            while ($r = $v.GetType().InvokeMember('Fetch','InvokeMethod',$null,$v,$null)) {
              ("COND: " + $r.GetType().InvokeMember('StringData','GetProperty',$null,$r,1) + "  =>  " + $r.GetType().InvokeMember('StringData','GetProperty',$null,$r,2)) | Tee-Object -FilePath win.log -Append
            }
          }
          ("SO: " + (Get-CimInstance Win32_OperatingSystem).Caption + " ProductType=" + (Get-CimInstance Win32_OperatingSystem).ProductType) | Tee-Object -FilePath win.log -Append
          exit $code
      - name: Publicar informe
        if: always()
        shell: bash
        run: |
          cp win.log /tmp/win.log 2>/dev/null || echo "sin log" > /tmp/win.log
          git config user.name "jarvis-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan win-report
          git rm -rqf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/win.log report.txt
          git add report.txt && git commit -qm "informe windows ${{ github.run_id }}" && git push -qf origin HEAD:win-report || true
