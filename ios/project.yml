# Genera Jarvis.xcodeproj con:  brew install xcodegen && xcodegen generate
name: Jarvis
options:
  bundleIdPrefix: com.jarvisglasses
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Jarvis
      - path: VozJarvis          # modelo de voz de Jarvis (lo coloca la compilación en la nube)
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/build-ios/sherpa-onnx.xcframework
        embed: false
      - framework: Vendor/build-ios/ios-onnxruntime/onnxruntime.xcframework
        embed: false
      - sdk: libc++.tbd
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvisglasses.app   # CÁMBIALO por uno único tuyo, p. ej. com.tunombre.jarvis
        PRODUCT_NAME: Jarvis
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Jarvis/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""                              # o elige tu Team en Xcode > Signing & Capabilities
        SWIFT_OBJC_BRIDGING_HEADER: Jarvis/Sherpa/Jarvis-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/build-ios/sherpa-onnx.xcframework/Headers
    entitlements:
      path: Jarvis/Jarvis.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: Jarvis/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [jarvisglasses]
        MWDAT:
          AppLinkURLScheme: "jarvisglasses://"
          MetaAppID: ""            # vacío = Modo desarrollador (basta para uso personal)
          ClientToken: ""
          TeamID: $(DEVELOPMENT_TEAM)
        UIBackgroundModes:
          - audio                  # sigue escuchando "Jarvis" con el teléfono bloqueado
          - location               # GPS y navegación con pantalla apagada
          - processing
          - bluetooth-central      # enlace con las gafas
          - bluetooth-peripheral
          - external-accessory
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        NSMicrophoneUsageDescription: Jarvis escucha el micrófono de tus gafas para oír "Jarvis" y tus órdenes.
        NSSpeechRecognitionUsageDescription: Jarvis reconoce tu voz en el teléfono para detectar "Jarvis" y entender tus órdenes.
        NSLocationWhenInUseUsageDescription: Jarvis usa tu ubicación para navegar y responder según dónde estás.
        NSLocationAlwaysAndWhenInUseUsageDescription: Jarvis usa tu ubicación para navegar y responder según dónde estás, también con el teléfono bloqueado.
        NSBluetoothAlwaysUsageDescription: Necesario para conectar con tus gafas Meta.
        NSBluetoothPeripheralUsageDescription: Necesario para conectar con tus gafas Meta.
        NSLocalNetworkUsageDescription: Permite encontrar y conectar con tus gafas por Wi-Fi.
        NSBonjourServices: [_bonjour._tcp]
        NSPhotoLibraryAddUsageDescription: Para guardar en Fotos las fotos en máxima calidad de tus gafas.
        NSCalendarsFullAccessUsageDescription: Jarvis lee tu agenda y crea eventos cuando se lo pides por voz.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  JarvisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JarvisTests
    dependencies:
      - target: Jarvis
      - package: MetaWearables
        product: MWDATMockDevice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvisglasses.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Jarvis.app/Jarvis
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
    test:
      targets:
        - JarvisTests
